server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Let's Encrypt HTTP-01 challenges, served from the certbot webroot volume
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # Exact match: serve the static API docs page for /api itself. Without
    # this, nginx 301-redirects /api to /api/ because of the proxy prefix
    # location below.
    location = /api {
        try_files /api.html =404;
    }

    # Trailing-slash spelling of the docs page: redirect to /api instead of
    # proxying to the backend (which has no route at exactly /api/).
    location = /api/ {
        return 301 /api;
    }

    # Backend API (user panel + admin panel, same origin)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI interactive docs (Swagger / ReDoc) kept as management entry
    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc {
        proxy_pass http://api:8000/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static pages: user panel at /, admin panel under /admin/
    location / {
        # Next.js static export produces flat .html files (admin.html,
        # admin/dashboard.html), so trailing slashes have no match. Redirect
        # them (except the root) to the slash-less form.
        rewrite ^(.+)/$ $1 permanent;
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
