server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/locations.conf;

    error_page 404 /404.html;
}

# HTTPS panel. The certificate is shared with the MX server and managed by
# the certbot sidecar (renewals hot-reload nginx via the entrypoint watcher).
# A self-signed placeholder is generated at container start when no
# certificate exists yet, so nginx can always listen on 443.
server {
    listen 443 ssl;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /config/certs/cert.pem;
    ssl_certificate_key /config/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/locations.conf;

    error_page 404 /404.html;
}
