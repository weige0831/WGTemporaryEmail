    # Let's Encrypt HTTP-01 challenges, served from the certbot webroot volume
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # Exact match: serve the static API docs page for /api itself. Without
    # this, nginx 301-redirects /api to /api/ because of the proxy prefix
    # location below.
    location = /api {
        try_files /api.html =404;
    }

    # Trailing-slash spelling of the docs page: redirect to /api instead of
    # proxying to the backend (which has no route at exactly /api/).
    location = /api/ {
        return 301 /api;
    }

    # Backend API (user panel + admin panel, same origin).
    # limit_req is the edge-side backstop for the in-process limiter: it keeps a
    # flood away from the API before a request is even proxied. The zones are
    # declared in 00-http.conf.
    location /api/ {
        limit_req zone=api_general burst=120 nodelay;
        limit_req_status 429;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API-key authenticated permanent-mailbox creation: deliberately NOT rate
    # limited at the edge (the key is the credential, and the API side has its
    # own limit which is disabled by default). Sibling locations do not inherit
    # limit_req from /api/, so omitting it here means "no edge limit".
    location ^~ /api/v1/api/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Setup wizard and admin API get a much tighter bucket (brute force).
    location ^~ /api/v1/setup/ {
        limit_req zone=api_strict burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/admin/ {
        limit_req zone=api_strict burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI interactive docs (Swagger / ReDoc) kept as management entry
    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc {
        proxy_pass http://api:8000/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin panel: never index it, never cache the HTML shell.
    # (安全头必须重新 include：本层一旦出现 add_header，继承的会被整体丢弃)
    location ^~ /admin {
        include /etc/nginx/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        rewrite ^(.+)/$ $1 permanent;
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Content-hashed build output can be cached forever: the filename changes
    # with its content.
    location /_next/static/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Static pages: user panel at /, admin panel under /admin/
    location / {
        include /etc/nginx/security-headers.conf;
        # Documents must revalidate on every load. Without this the browser
        # heuristically caches the HTML, and after a redeploy it keeps asking
        # for chunk files that no longer exist - the page then dies with
        # "Application error: a client-side exception" until a hard refresh.
        # ETag keeps the revalidation cheap (304 when unchanged).
        add_header Cache-Control "no-cache" always;
        # Next.js static export produces flat .html files (admin.html,
        # admin/dashboard.html), so trailing slashes have no match. Redirect
        # them (except the root) to the slash-less form.
        rewrite ^(.+)/$ $1 permanent;
        try_files $uri $uri.html $uri/index.html =404;
    }
