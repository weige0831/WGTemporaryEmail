services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tempmail_db
    environment:
      POSTGRES_DB: tempmail
      POSTGRES_USER: tempmail
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD（运行 ./setup.sh 会自动生成）}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tempmail"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - tempmail_network

  # FastAPI Backend
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: tempmail_api
    environment:
      CONFIG_PATH: /config/config.yaml
      API_HOST: ${API_HOST:-0.0.0.0}  # Bind to all interfaces in container by default
    volumes:
      # Writable: the admin panel persists domain/config changes to this file
      - ./config.yaml:/config/config.yaml
      # TLS certs (read-only) for status display + certbot job queue (rw)
      - ./certs:/config/certs:ro
      - certbot_data:/certbot-data
    # No host port mapping - the web service (nginx) proxies /api internally
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/v1/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - tempmail_network

  # Go MX Server
  mx:
    build:
      context: ./mx
      dockerfile: Dockerfile
    container_name: tempmail_mx
    environment:
      CONFIG_PATH: /config/config.yaml
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./certs:/config/certs:ro  # Maps host ./certs/ to container /config/certs/
    ports:
      - "25:25"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "25"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - tempmail_network

  # Web: nginx serving the static frontend (user panel + admin panel) and
  # reverse-proxying /api, /docs, /redoc to the API service.
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: tempmail_web
    ports:
      - "${WEB_PORT:-80}:80"
      - "443:443"
    volumes:
      # Let's Encrypt HTTP-01 challenge files (written by the certbot sidecar)
      - certbot_webroot:/var/www/certbot:ro
      # TLS certs shared with the MX (the entrypoint may write a self-signed
      # placeholder here until certbot issues the real certificate)
      - ./certs:/config/certs
      # config.yaml drives the generated nginx server names and IP-access policy
      - ./config.yaml:/config/config.yaml:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tempmail_network

  # Let's Encrypt sidecar: issues and auto-renews certificates (HTTP-01
  # webroot through the nginx container). The admin API submits jobs via the
  # shared certbot_data volume; output certs land in ./certs for the MX.
  certbot:
    build:
      context: ./certbot
      dockerfile: Dockerfile
    container_name: tempmail_certbot
    volumes:
      - certbot_data:/certbot-data
      - certbot_webroot:/certbot-data/webroot
      - ./certs:/certbot-data/certs
    restart: unless-stopped
    networks:
      - tempmail_network

volumes:
  postgres_data:
    driver: local
  certbot_data:
    driver: local
  certbot_webroot:
    driver: local

networks:
  tempmail_network:
    driver: bridge
