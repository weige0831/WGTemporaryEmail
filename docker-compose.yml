services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tempmail_db
    environment:
      POSTGRES_DB: tempmail
      POSTGRES_USER: tempmail
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD（运行 ./setup.sh 会自动生成）}
    # Reap transactions that are left idle (a hung request would otherwise hold
    # a connection forever and eventually starve the API's pool) and detect dead
    # clients faster than the 2-hour TCP default.
    command: >
      postgres
      -c idle_in_transaction_session_timeout=60s
      -c tcp_keepalives_idle=60
      -c tcp_keepalives_interval=15
      -c tcp_keepalives_count=4
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tempmail"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Cap the blast radius of a runaway query or connection storm.
    mem_limit: 384m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - backend

  # FastAPI Backend
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: tempmail_api
    environment:
      CONFIG_PATH: /config/config.yaml
      API_HOST: ${API_HOST:-0.0.0.0}  # Bind to all interfaces in container by default
      PYTHONDONTWRITEBYTECODE: "1"    # root filesystem is read-only
      # Every 5 minutes dump all thread stacks to the log: if the service hangs
      # again, `docker compose logs api` shows where the threads are stuck.
      FAULTHANDLER_SECONDS: "300"
    volumes:
      # Writable: the admin panel persists domain/config changes to this file
      - ./config.yaml:/config/config.yaml
      # TLS certs (read-only) + certbot job queue (rw)
      - ./certs:/config/certs:ro
      - certbot_data:/certbot-data
      # Publishes only the few settings nginx needs (panel hostname, IP-access
      # policy, TLS/docs switches) so this container never sees config.yaml
      # and its database password / admin token.
      - web_config:/web-config
    # No host port mapping - the web service (nginx) proxies /api internally
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/v1/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 384m
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    # Bridges both networks: nginx reaches it over frontend, the database over backend.
    networks:
      - frontend
      - backend

  # Go MX Server
  mx:
    build:
      context: ./mx
      dockerfile: Dockerfile
    container_name: tempmail_mx
    environment:
      CONFIG_PATH: /config/config.yaml
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./certs:/config/certs:ro  # Maps host ./certs/ to container /config/certs/
    ports:
      - "25:25"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "25"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: 256m
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - backend

  # Web: nginx serving the static frontend (user panel + admin panel) and
  # reverse-proxying /api to the API service.
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: tempmail_web
    ports:
      - "${WEB_PORT:-80}:80"
      - "443:443"
    volumes:
      # Let's Encrypt HTTP-01 challenge files (written by the certbot sidecar)
      - certbot_webroot:/var/www/certbot:ro
      # TLS certificates, read-only: the entrypoint keeps its self-signed
      # placeholder in an image-internal directory, so a compromised web
      # container cannot replace the certificate the MX trusts.
      - ./certs:/config/certs:ro
      # Generated by the api container: WEB_HOSTNAME / ALLOW_IP / TLS_ENABLED /
      # DOCS_ENABLED only - no secrets (config.yaml stays out of this container).
      - web_config:/web-config:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "80"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    mem_limit: 192m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    # Frontend only: nginx proxies to the API but cannot reach the database.
    networks:
      - frontend

  # Let's Encrypt sidecar: issues and auto-renews certificates (HTTP-01
  # webroot through the nginx container). The admin API submits jobs via the
  # shared certbot_data volume; output certs land in ./certs for the MX.
  certbot:
    build:
      context: ./certbot
      dockerfile: Dockerfile
    container_name: tempmail_certbot
    volumes:
      - certbot_data:/certbot-data
      - certbot_webroot:/certbot-data/webroot
      - ./certs:/certbot-data/certs
      # Prepared here (root) so the api container (uid 1000) can write it.
      - web_config:/web-config
    healthcheck:
      # The sidecar is a long-running shell loop; a readable job directory
      # means it started and mounted its volumes.
      test: ["CMD-SHELL", "test -d /certbot-data/jobs && test -d /certbot-data/certs"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 192m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres_data:
    driver: local
  web_config:
    driver: local
  certbot_data:
    driver: local
  certbot_webroot:
    driver: local

# Two networks so a compromised nginx (frontend) cannot reach PostgreSQL:
# only the API bridges both.
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
